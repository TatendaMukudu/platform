name: Truth Layer

# The truth layer is the gate: nothing merges to main red. Runs on every PR and every push
# to main. Pair this with a branch-protection rule on `main` requiring this check to pass.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  truth-layer:
    name: node scripts/test.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_OPTIONAL: '1'          # the suites boot the real app without a database
      # No ANTHROPIC_API_KEY / OPENAI_API_KEY on purpose: the suites assert the honest
      # deterministic behaviour with the model OFF, and CI must never carry a live key.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run the truth layer
        # node --check on every source + every smoke suite + deadcode scan. The frontend
        # smoke self-skips when Chromium isn't present (headless browser not installed here),
        # so this gates all of the Node-logic surface — the reasoning core, the governed
        # boundaries, auth isolation, safeguarding, rate limits, and the rest.
        run: node scripts/test.js
