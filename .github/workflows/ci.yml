name: Truth Layer

# The truth layer is the gate: nothing merges to main red. Runs on every PR and every push
# to main. Pair this with a branch-protection rule on `main` requiring this check to pass.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  truth-layer:
    name: node scripts/test.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DB_OPTIONAL: '1'          # the suites boot the real app without a database
      # No ANTHROPIC_API_KEY / OPENAI_API_KEY on purpose: the suites assert the honest
      # deterministic behaviour with the model OFF, and CI must never carry a live key.
    steps:
      - uses: actions/checkout@v4
        with:
          # docs-status-smoke checks that docs/INDEX.md names a commit that is a real ancestor
          # of HEAD, and how far behind it is. checkout's default is a single commit, so that
          # commit was not in the clone at all and the guard reported "not an ancestor" — true
          # of the shallow clone, false of the repository. Same fix as #81 (codex).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run the truth layer
        # node --check on every source + every smoke suite + deadcode scan. The frontend
        # smoke self-skips when Chromium isn't present (headless browser not installed here),
        # so this gates all of the Node-logic surface — the reasoning core, the governed
        # boundaries, auth isolation, safeguarding, rate limits, and the rest.
        run: node scripts/test.js

  durable-restart:
    name: PostgreSQL acknowledged-write restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelliq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelliq"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Prove acknowledged accounts survive two-process restart
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/intelliq
          PG_SSL_DISABLE: '1'
        run: node scripts/durable-restart-check.js
